interface:
  display_name: "SEO Code Diagnostic"
  short_description: "SEO ranking audit plus a GEO launch gate."
  default_prompt: "Use $seo-code-diagnostic to audit this website codebase with URL-first evidence and the Top 10 factor table. Follow 哥飞 when it conflicts with Zyppy: TDH and density for focus, one keyword group per page, sitewide internal links, backlinks required for old/competitive keywords, no fake queues. Separate Confirmed findings from Candidate and Unknown. Do not invent GSC/Ahrefs/backlink/CTR numbers. Do not run an AdSense audit in this skill. If the site is about to launch, run the GEO gate on only the pages shipping now: open each as a visitor, click every link, read every visible line. Scanner pass is not launch-ready."
policy:
