interface:
  display_name: "SEO Code Diagnostic"
  short_description: "Codebase SEO/AdSense audit: intent, quality, crawl; no invented metrics."
  default_prompt: "Use $seo-code-diagnostic to audit this website codebase for crawlability, search-intent match, content quality, internal links, YMYL/internal-copy risks, and AdSense readiness. Treat technical SEO as table stakes. Do not invent GSC/Ahrefs/backlink/CTR numbers. For AdSense, cover every ADS-* requirement with Pass/Fail/Unknown/N/A and a Completeness Check."
policy:
  allow_implicit_invocation: true
